<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عيادة جراحة وطب الأسنان - نظام الإدارة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap');
    body { font-family: 'Cairo', sans-serif; }
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 antialiased min-h-screen flex flex-col" x-data="dentalApp()" x-init="initApp()" :dir="lang === 'ar' ? 'rtl' : 'ltr'">

  <!-- شاشة تسجيل الدخول -->
  <div x-show="!isAuthenticated" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/90 backdrop-blur-xl p-4">
    <div class="bg-slate-900/90 border border-slate-800 rounded-3xl shadow-2xl w-full max-w-md p-6 sm:p-8 space-y-6 relative overflow-hidden">
      
      <!-- زر تغيير اللغة -->
      <div class="flex justify-end">
        <button @click="toggleLang()" class="text-xs font-bold bg-slate-800 hover:bg-slate-700 text-teal-400 px-3 py-1.5 rounded-xl transition border border-slate-700/50 flex items-center gap-2">
          <i class="fa-solid fa-globe"></i>
          <span x-text="lang === 'ar' ? 'Français' : 'العربية'"></span>
        </button>
      </div>

      <div class="text-center space-y-2">
        <div class="inline-flex bg-gradient-to-tr from-teal-500 to-emerald-400 text-slate-950 p-4 rounded-2xl shadow-lg shadow-teal-500/20 mb-2">
          <i class="fa-solid fa-tooth text-3xl"></i>
        </div>
        <h2 class="text-2xl font-black text-slate-100" x-text="t('appTitle')"></h2>
        <p class="text-xs text-slate-400 font-semibold" x-text="t('loginSubtitle')"></p>
      </div>

      <form @submit.prevent="login()" class="space-y-4 text-xs">
        <div>
          <label class="block font-bold text-slate-300 mb-1" x-text="t('emailLabel')"></label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute top-3.5 text-slate-500" :class="lang === 'ar' ? 'right-3' : 'left-3'"></i>
            <input type="email" x-model="loginEmail" placeholder="medecin@clinic.com" required 
              :class="lang === 'ar' ? 'pr-9 pl-3' : 'pl-9 pr-3'"
              class="w-full py-2.5 bg-slate-800/80 border border-slate-700/80 rounded-xl text-slate-100 focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition">
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-300 mb-1" x-text="t('passwordLabel')"></label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute top-3.5 text-slate-500" :class="lang === 'ar' ? 'right-3' : 'left-3'"></i>
            <input type="password" x-model="loginPassword" placeholder="••••••••" required 
              :class="lang === 'ar' ? 'pr-9 pl-3' : 'pl-9 pr-3'"
              class="w-full py-2.5 bg-slate-800/80 border border-slate-700/80 rounded-xl text-slate-100 focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition">
          </div>
        </div>

        <div x-show="authError" class="p-3 bg-rose-500/10 border border-rose-500/20 text-rose-400 rounded-xl text-center font-bold text-xs" x-text="authError"></div>

        <button type="submit" :disabled="isLoading" class="w-full bg-gradient-to-r from-teal-500 to-emerald-500 hover:from-teal-400 hover:to-emerald-400 text-slate-950 py-3 rounded-xl font-bold text-xs transition shadow-lg shadow-teal-500/20 flex items-center justify-center gap-2">
          <span x-show="!isLoading"><i class="fa-solid fa-right-to-bracket"></i> <span x-text="t('loginBtn')"></span></span>
          <span x-show="isLoading" class="animate-spin"><i class="fa-solid fa-circle-notch"></i></span>
        </button>
      </form>
    </div>
  </div>

  <!-- الشاشة الرئيسية -->
  <div x-show="isAuthenticated" x-cloak class="flex-1 flex flex-col">
    <!-- الشريط العلوي -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="bg-gradient-to-tr from-teal-500 to-emerald-400 text-slate-950 p-2 rounded-xl shadow-md shadow-teal-500/10 font-black text-xl">
            <i class="fa-solid fa-tooth"></i>
          </div>
          <div>
            <h1 class="font-black text-sm sm:text-base leading-none text-slate-100" x-text="t('appTitle')"></h1>
            <p class="text-xs text-teal-400 font-semibold mt-1" x-text="userRole === 'doctor' ? t('roleDoctor') : t('roleAssistant')"></p>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <button @click="toggleLang()" class="text-xs font-bold bg-slate-800 hover:bg-slate-700 text-teal-400 px-3 py-1.5 rounded-xl transition border border-slate-700/50 flex items-center gap-1.5">
            <i class="fa-solid fa-globe"></i>
            <span x-text="lang === 'ar' ? 'Fr' : 'عربي'"></span>
          </button>
          
          <button @click="logout()" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
            <i class="fa-solid fa-power-off"></i>
            <span x-text="t('logout')"></span>
          </button>
        </div>
      </div>
    </header>

    <!-- القائمة الرئيسية -->
    <nav class="bg-slate-900/50 border-b border-slate-800/80 backdrop-blur-md sticky top-16 z-20">
      <div class="max-w-7xl mx-auto px-4 flex gap-2 overflow-x-auto text-xs font-bold py-2.5">
        <button @click="activeTab = 'agenda'" :class="activeTab === 'agenda' ? 'bg-teal-500 text-slate-950 shadow-lg shadow-teal-500/20' : 'bg-slate-800/60 text-slate-400 hover:bg-slate-800 hover:text-slate-200'" class="px-4 py-2 rounded-xl transition whitespace-nowrap flex items-center gap-2">
          <i class="fa-solid fa-calendar-days"></i> <span x-text="t('tabAgenda')"></span>
        </button>
        <button @click="activeTab = 'patients'" :class="activeTab === 'patients' ? 'bg-teal-500 text-slate-950 shadow-lg shadow-teal-500/20' : 'bg-slate-800/60 text-slate-400 hover:bg-slate-800 hover:text-slate-200'" class="px-4 py-2 rounded-xl transition whitespace-nowrap flex items-center gap-2">
          <i class="fa-solid fa-users"></i> <span x-text="t('tabPatients')"></span>
        </button>
        
        <template x-if="userRole === 'doctor'">
          <button @click="activeTab = 'finances'" :class="activeTab === 'finances' ? 'bg-teal-500 text-slate-950 shadow-lg shadow-teal-500/20' : 'bg-slate-800/60 text-slate-400 hover:bg-slate-800 hover:text-slate-200'" class="px-4 py-2 rounded-xl transition whitespace-nowrap flex items-center gap-2">
            <i class="fa-solid fa-wallet"></i> <span x-text="t('tabFinances')"></span>
          </button>
        </template>

        <button @click="activeTab = 'chat'" :class="activeTab === 'chat' ? 'bg-teal-500 text-slate-950 shadow-lg shadow-teal-500/20' : 'bg-slate-800/60 text-slate-400 hover:bg-slate-800 hover:text-slate-200'" class="px-4 py-2 rounded-xl transition whitespace-nowrap flex items-center gap-2">
          <i class="fa-solid fa-comments"></i> <span x-text="t('tabChat')"></span>
        </button>
      </div>
    </nav>

    <!-- المحتوى الرئيسي -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">

      <!-- 1. المواعيد -->
      <div x-show="activeTab === 'agenda'" class="space-y-4">
        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex items-center justify-between">
          <h2 class="font-black text-slate-200 text-sm md:text-base flex items-center gap-2">
            <i class="fa-solid fa-calendar-check text-teal-400"></i> <span x-text="t('agendaTitle')"></span>
          </h2>
          <button @click="openAppointmentModal()" class="bg-gradient-to-r from-teal-500 to-emerald-500 hover:from-teal-400 hover:to-emerald-400 text-slate-950 px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-md shadow-teal-500/10">
            <i class="fa-solid fa-calendar-plus"></i> <span x-text="t('newAppointment')"></span>
          </button>
        </div>

        <div class="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden shadow-xl">
          <div class="overflow-x-auto">
            <table class="w-full text-right text-xs">
              <thead class="bg-slate-800/80 text-slate-400 font-bold border-b border-slate-800">
                <tr>
                  <th class="p-3.5" x-text="t('patientName')"></th>
                  <th class="p-3.5" x-text="t('phone')"></th>
                  <th class="p-3.5" x-text="t('dateTime')"></th>
                  <th class="p-3.5" x-text="t('treatment')"></th>
                  <th class="p-3.5" x-show="userRole === 'doctor'" x-text="t('cost')"></th>
                  <th class="p-3.5 text-center" x-text="t('actions')"></th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-800/60">
                <template x-for="app in appointments" :key="app.id">
                  <tr class="hover:bg-slate-800/40 transition">
                    <td class="p-3.5 font-bold text-slate-200" x-text="app.patientName"></td>
                    <td class="p-3.5 font-mono text-slate-400" x-text="app.phone || '-'"></td>
                    <td class="p-3.5 font-mono text-teal-400 font-bold" x-text="app.date + ' ' + app.time"></td>
                    <td class="p-3.5 text-slate-300" x-text="app.treatment"></td>
                    <td class="p-3.5 font-black text-emerald-400" x-show="userRole === 'doctor'" x-text="app.cost + ' DZD'"></td>
                    <td class="p-3.5 text-center space-x-2 space-x-reverse">
                      <a :href="getWhatsAppLink(app)" target="_blank" class="bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/20 px-2.5 py-1 rounded-lg text-xs font-bold inline-flex items-center gap-1 transition">
                        <i class="fa-brands fa-whatsapp"></i> <span x-text="t('whatsappReminder')"></span>
                      </a>
                      <button @click="editAppointment(app)" class="text-sky-400 hover:text-sky-300 p-1 font-bold"><i class="fa-solid fa-pen"></i></button>
                      <button @click="deleteRecord('cabinet_appointments', app.id)" class="text-rose-400 hover:text-rose-300 p-1 font-bold"><i class="fa-solid fa-trash"></i></button>
                    </td>
                  </tr>
                </template>
                <template x-if="appointments.length === 0">
                  <tr><td colspan="6" class="p-8 text-center text-slate-500 font-bold" x-text="t('noData')"></td></tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- 2. المرضى -->
      <div x-show="activeTab === 'patients'" x-cloak class="space-y-4">
        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-3">
          <div class="relative w-full sm:w-80">
            <i class="fa-solid fa-magnifying-glass absolute top-3 text-slate-500" :class="lang === 'ar' ? 'right-3' : 'left-3'"></i>
            <input type="text" x-model="patientSearch" :placeholder="t('searchPatient')" 
              :class="lang === 'ar' ? 'pr-9 pl-3' : 'pl-9 pr-3'"
              class="w-full py-2 bg-slate-800/80 border border-slate-700/80 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-teal-500">
          </div>
          <button @click="openPatientModal()" class="w-full sm:w-auto bg-gradient-to-r from-teal-500 to-emerald-500 hover:from-teal-400 hover:to-emerald-400 text-slate-950 px-4 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 shadow-md shadow-teal-500/10">
            <i class="fa-solid fa-user-plus"></i> <span x-text="t('newPatient')"></span>
          </button>
        </div>

        <div class="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden shadow-xl">
          <div class="overflow-x-auto">
            <table class="w-full text-right text-xs">
              <thead class="bg-slate-800/80 text-slate-400 font-bold border-b border-slate-800">
                <tr>
                  <th class="p-3.5" x-text="t('patientName')"></th>
                  <th class="p-3.5" x-text="t('phone')"></th>
                  <th class="p-3.5" x-text="t('age')"></th>
                  <th class="p-3.5" x-text="t('diagnosis')"></th>
                  <th class="p-3.5 text-center" x-text="t('actions')"></th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-800/60">
                <template x-for="p in filteredPatients" :key="p.id">
                  <tr class="hover:bg-slate-800/40 transition">
                    <td class="p-3.5 font-bold text-slate-200" x-text="p.name"></td>
                    <td class="p-3.5 font-mono text-slate-400" x-text="p.phone"></td>
                    <td class="p-3.5 text-slate-300" x-text="p.age ? p.age + ' ' + t('years') : '-'"></td>
                    <td class="p-3.5 text-slate-400 max-w-xs truncate" x-text="p.diagnosis"></td>
                    <td class="p-3.5 text-center space-x-2 space-x-reverse">
                      <button @click="openPatientHistory(p)" class="bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/20 px-2.5 py-1 rounded-lg text-xs font-bold inline-flex items-center gap-1 transition">
                        <i class="fa-solid fa-clock-rotate-left"></i> <span x-text="t('history')"></span>
                      </button>
                      <button @click="openAppointmentModalForPatient(p)" class="text-teal-400 hover:text-teal-300 font-bold px-1" x-text="t('addRdv')"></button>
                      <button @click="editPatient(p)" class="text-sky-400 hover:text-sky-300 p-1"><i class="fa-solid fa-pen"></i></button>
                      <button @click="deleteRecord('cabinet_patients', p.id)" class="text-rose-400 hover:text-rose-300 p-1"><i class="fa-solid fa-trash"></i></button>
                    </td>
                  </tr>
                </template>
                <template x-if="filteredPatients.length === 0">
                  <tr><td colspan="5" class="p-8 text-center text-slate-500 font-bold" x-text="t('noData')"></td></tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- 3. المالية -->
      <div x-show="activeTab === 'finances' && userRole === 'doctor'" x-cloak class="space-y-6">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-xl relative overflow-hidden">
            <div class="absolute top-0 left-0 w-2 h-full bg-emerald-500"></div>
            <p class="text-xs text-slate-400 font-bold" x-text="t('todayRevenue')"></p>
            <h3 class="text-2xl font-black text-emerald-400 mt-2 font-mono" x-text="todayRevenue + ' DZD'">0 DZD</h3>
          </div>
          <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-xl relative overflow-hidden">
            <div class="absolute top-0 left-0 w-2 h-full bg-teal-500"></div>
            <p class="text-xs text-slate-400 font-bold" x-text="t('totalRevenue')"></p>
            <h3 class="text-2xl font-black text-teal-400 mt-2 font-mono" x-text="totalPayments + ' DZD'">0 DZD</h3>
          </div>
        </div>

        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex items-center justify-between">
          <h2 class="font-black text-slate-200 text-sm md:text-base flex items-center gap-2">
            <i class="fa-solid fa-receipt text-teal-400"></i> <span x-text="t('paymentsList')"></span>
          </h2>
          <button @click="openPaymentModal()" class="bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-md shadow-emerald-500/10">
            <i class="fa-solid fa-money-bill-wave"></i> <span x-text="t('newPayment')"></span>
          </button>
        </div>

        <div class="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden shadow-xl">
          <div class="overflow-x-auto">
            <table class="w-full text-right text-xs">
              <thead class="bg-slate-800/80 text-slate-400 font-bold border-b border-slate-800">
                <tr>
                  <th class="p-3.5" x-text="t('patientName')"></th>
                  <th class="p-3.5" x-text="t('amount')"></th>
                  <th class="p-3.5" x-text="t('dateTime')"></th>
                  <th class="p-3.5" x-text="t('notes')"></th>
                  <th class="p-3.5 text-center" x-text="t('actions')"></th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-800/60">
                <template x-for="pay in payments" :key="pay.id">
                  <tr class="hover:bg-slate-800/40 transition">
                    <td class="p-3.5 font-bold text-slate-200" x-text="pay.patientName"></td>
                    <td class="p-3.5 font-black text-emerald-400 font-mono" x-text="pay.amount + ' DZD'"></td>
                    <td class="p-3.5 font-mono text-slate-400" x-text="pay.dateTime"></td>
                    <td class="p-3.5 text-slate-400" x-text="pay.note"></td>
                    <td class="p-3.5 text-center">
                      <button @click="deleteRecord('cabinet_payments', pay.id)" class="text-rose-400 hover:text-rose-300 p-1"><i class="fa-solid fa-trash"></i></button>
                    </td>
                  </tr>
                </template>
                <template x-if="payments.length === 0">
                  <tr><td colspan="5" class="p-8 text-center text-slate-500 font-bold" x-text="t('noData')"></td></tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- 4. الدردشة الداخلية -->
      <div x-show="activeTab === 'chat'" x-cloak class="space-y-4">
        <div class="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden flex flex-col h-[520px] shadow-2xl">
          <div class="bg-slate-800/80 border-b border-slate-800 p-4 font-bold text-sm text-slate-200 flex items-center gap-2">
            <i class="fa-solid fa-comments text-teal-400"></i> <span x-text="t('internalChat')"></span>
          </div>
          <div class="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-950/40">
            <template x-for="msg in chatMessages" :key="msg.id">
              <div :class="msg.senderEmail === userEmail ? 'flex justify-start' : 'flex justify-end'">
                <div :class="msg.senderEmail === userEmail ? 'bg-teal-500 text-slate-950' : 'bg-slate-800 text-slate-200 border border-slate-700/60'" class="max-w-md rounded-2xl p-3 text-xs space-y-1 shadow-md">
                  <div class="flex justify-between gap-4 text-[10px] opacity-75 font-bold">
                    <span x-text="msg.senderRole === 'doctor' ? t('roleDoctor') : t('roleAssistant')"></span>
                    <span x-text="msg.time"></span>
                  </div>
                  <p class="font-medium whitespace-pre-wrap" x-text="msg.text"></p>
                </div>
              </div>
            </template>
          </div>
          <form @submit.prevent="sendChatMessage()" class="p-3 bg-slate-900 border-t border-slate-800 flex gap-2">
            <input type="text" x-model="chatInput" :placeholder="t('typeMessage')" required class="flex-1 p-2.5 bg-slate-800/80 border border-slate-700/80 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-teal-500">
            <button type="submit" class="bg-teal-500 hover:bg-teal-400 text-slate-950 px-5 py-2.5 rounded-xl font-bold text-xs transition shadow-md shadow-teal-500/10 flex items-center gap-1.5">
              <i class="fa-solid fa-paper-plane"></i> <span x-text="t('send')"></span>
            </button>
          </form>
        </div>
      </div>

    </main>
  </div>

  <!-- النوافذ المنبثقة (Modals) -->

  <!-- نافذة تاريخ المريض -->
  <div x-show="showHistoryModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl w-full max-w-2xl p-6 space-y-5 text-xs max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="font-black text-base text-teal-400 flex items-center gap-2">
          <i class="fa-solid fa-clock-rotate-left"></i> <span x-text="t('patientHistory')"></span>
        </h3>
        <button @click="showHistoryModal = false" class="text-slate-500 hover:text-slate-300 font-bold text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="bg-slate-800/50 p-4 rounded-2xl border border-slate-800 grid grid-cols-2 gap-3 text-slate-300">
        <div><span class="font-bold text-slate-400" x-text="t('patientName') + ': '"></span><span class="font-bold text-slate-100" x-text="selectedPatient.name"></span></div>
        <div><span class="font-bold text-slate-400" x-text="t('phone') + ': '"></span><span x-text="selectedPatient.phone || '-'"></span></div>
        <div class="col-span-2"><span class="font-bold text-slate-400" x-text="t('diagnosis') + ': '"></span><span x-text="selectedPatient.diagnosis || '-'"></span></div>
      </div>

      <!-- تاريخ المواعيد -->
      <div class="space-y-2">
        <h4 class="font-bold text-slate-200 text-xs flex items-center gap-1.5"><i class="fa-solid fa-calendar-days text-teal-400"></i> <span x-text="t('tabAgenda')"></span></h4>
        <div class="border border-slate-800 rounded-xl overflow-hidden">
          <table class="w-full text-right">
            <thead class="bg-slate-800/80 text-slate-400 font-bold border-b border-slate-800">
              <tr><th class="p-2.5" x-text="t('dateTime')"></th><th class="p-2.5" x-text="t('treatment')"></th><th class="p-2.5" x-show="userRole === 'doctor'" x-text="t('cost')"></th></tr>
            </thead>
            <tbody class="divide-y divide-slate-800/60">
              <template x-for="app in patientAppointments" :key="app.id">

  <!-- سكربت الربط مع الـ FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // ⚠️ ضع مفاتيح الفايربيس الجديدة للعيادة الثانية هنا
const firebaseConfig = {
  apiKey: "AIzaSyAA_WirY8W2AXOyz3JD4UKdu-GqNXHniRc",
  authDomain: "dent-3.firebaseapp.com",
  projectId: "dent-3",
  storageBucket: "dent-3.firebasestorage.app",
  messagingSenderId: "1031127135097",

  measurementId: "G-LW42MPK6FJ"

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    enableIndexedDbPersistence(db).catch(() => {});

    window.firebaseService = { auth, db, signInWithEmailAndPassword, signOut, onAuthStateChanged, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot };

  <!-- منطق التطبيق والترجمة (ALPINE LOGIC) -->
  <script>
    function dentalApp() {
      return {
        lang: 'ar',
        isAuthenticated: false,
        isLoading: false,
        authError: '',
        userEmail: '',
        userRole: 'assistant',

        loginEmail: '',
        loginPassword: '',

        activeTab: 'agenda',
        patientSearch: '',

        showPatientModal: false,
        showAppointmentModal: false,
        showPaymentModal: false,
        showHistoryModal: false,

        editingPatientId: null,
        editingAppointmentId: null,
        selectedPatient: {},

        patientForm: { name: '', phone: '', age: '', diagnosis: '' },
        appointmentForm: { patientName: '', phone: '', date: new Date().toISOString().split('T')[0], time: '09:00', treatment: '', cost: 2000 },
        paymentForm: { patientName: '', amount: 0, date: new Date().toISOString().split('T')[0], note: '' },
        chatInput: '',

        patients: [],
        appointments: [],
        payments: [],
        chatMessages: [],

        translations: {
          ar: {
            appTitle: "عيادة جراحة وطب الأسنان",
            loginSubtitle: "يرجى تسجيل الدخول للحساب",
            emailLabel: "البريد الإلكتروني",
            passwordLabel: "كلمة السر",
            loginBtn: "تسجيل الدخول",
            roleDoctor: "حساب: دكتور (صلاحيات كاملة)",
            roleAssistant: "حساب: مساعد (صلاحيات محدودة)",
            logout: "خروج",
            tabAgenda: "جدول المواعيد",
            tabPatients: "سجلات المرضى",
            tabFinances: "الإيرادات والدفعات",
            tabChat: "المحادثة الداخلية",
            agendaTitle: "جدول المواعيد الحالية",
            newAppointment: "موعد جديد",
            patientName: "اسم المريض",
            phone: "الهاتف",
            dateTime: "التاريخ والوقت",
            treatment: "نوع العلاج",
            cost: "التكلفة (د.ج)",
            actions: "إجراءات",
            whatsappReminder: "تذكير",
            searchPatient: "بحث عن مريض...",
            newPatient: "مريض جديد",
            age: "العمر",
            years: "سنة",
            diagnosis: "التشخيص / ملاحظات",
            history: "السجل",
            addRdv: "+ موعد",
            todayRevenue: "إيرادات اليوم",
            totalRevenue: "إجمالي المداخيل",
            paymentsList: "سجل الدفعات والتحصيلات",
            newPayment: "تسجيل دفعة",
            amount: "المبلغ (د.ج)",
            notes: "ملاحظات",
            internalChat: "المحادثة الداخلية للعيادة",
            typeMessage: "اكتب رسالتك هنا...",
            send: "إرسال",
            patientHistory: "السجل الطبي والمادي للمريض",
            cancel: "إلغاء",
            save: "حفظ",
            editPatient: "تعديل بيانات المريض",
            editAppointment: "تعديل الموعد",
            noData: "لا توجد بيانات مسجلة حالياً",
            date: "التاريخ",
            time: "الوقت"
          },
          fr: {
            appTitle: "Cabinet de Chirurgie Dentaire",
            loginSubtitle: "Veuillez vous connecter à votre compte",
            emailLabel: "Adresse Email",
            passwordLabel: "Mot de passe",
            loginBtn: "Se Connecter",
            roleDoctor: "Compte: Dr. Médecin (Accès Total)",
            roleAssistant: "Compte: Assistant(e) (Accès Limité)",
            logout: "Déconnexion",
            tabAgenda: "Agenda & RDV",
            tabPatients: "Dossiers Patients",
            tabFinances: "Revenus & Versements",
            tabChat: "Messagerie Interne",
            agendaTitle: "Agenda des Rendez-vous",
            newAppointment: "Nouveau RDV",
            patientName: "Patient",
            phone: "Téléphone",
            dateTime: "Date & Heure",
            treatment: "Soin",
            cost: "Coût (DZD)",
            actions: "Actions",
            whatsappReminder: "Rappel",
            searchPatient: "Rechercher patient...",
            newPatient: "Nouveau Patient",
            age: "Âge",
            years: "ans",
            diagnosis: "Diagnostic / Notes",
            history: "Historique",
            addRdv: "+ RDV",
            todayRevenue: "Revenus du Jour",
            totalRevenue: "Total Versements",
            paymentsList: "Suivi des Versements",
            newPayment: "Nouveau Versement",
            amount: "Montant (DZD)",
            notes: "Notes",
            internalChat: "Messagerie Interne",
            typeMessage: "Message...",
            send: "Envoyer",
            patientHistory: "Historique du Patient",
            cancel: "Annuler",
            save: "Enregistrer",
            editPatient: "Modifier le Patient",
            editAppointment: "Modifier le RDV",
            noData: "Aucune donnée disponible",
            date: "Date",
            time: "Heure"
          }
        },

        t(key) {
          return this.translations[this.lang][key] || key;
        },

        toggleLang() {
          this.lang = this.lang === 'ar' ? 'fr' : 'ar';
        },

        initApp() {
          const check = setInterval(() => {
            if (window.firebaseService) {
              clearInterval(check);
              this.listenAuth();
            }
          }, 100);
        },

        listenAuth() {
          const { auth, onAuthStateChanged } = window.firebaseService;
          onAuthStateChanged(auth, (user) => {
            if (user) {
              this.isAuthenticated = true;
              this.userEmail = user.email;
              this.userRole = (user.email.includes('medecin') || user.email.includes('doctor')) ? 'doctor' : 'assistant';
              this.loadCloudData();
            } else {
              this.isAuthenticated = false;
            }
          });
        },

        async login() {
          this.isLoading = true;
          this.authError = '';
          try {
            await window.firebaseService.signInWithEmailAndPassword(window.firebaseService.auth, this.loginEmail, this.loginPassword);
          } catch (err) {
            this.authError = "خطأ في البريد أو كلمة السر / Email ou mot de passe incorrect.";
          } finally {
            this.isLoading = false;
          }
        },

        async logout() {
          await window.firebaseService.signOut(window.firebaseService.auth);
        },

        loadCloudData() {
          const { db, collection, onSnapshot } = window.firebaseService;
          onSnapshot(collection(db, "cabinet_patients"), snap => this.patients = snap.docs.map(d => ({ id: d.id, ...d.data() })));
          onSnapshot(collection(db, "cabinet_appointments"), snap => this.appointments = snap.docs.map(d => ({ id: d.id, ...d.data() })));
          onSnapshot(collection(db, "cabinet_payments"), snap => this.payments = snap.docs.map(d => ({ id: d.id, ...d.data() })));
          onSnapshot(collection(db, "cabinet_chat"), snap => {
            this.chatMessages = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (a.timestamp||0) - (b.timestamp||0));
          });
        },

        get filteredPatients() { return this.patients.filter(p => (p.name || '').toLowerCase().includes(this.patientSearch.toLowerCase())); },
        get todayRevenue() { const t = new Date().toISOString().split('T')[0]; return this.payments.filter(p => p.date === t).reduce((s,p) => s + (Number(p.amount)||0), 0); },
        get totalPayments() { return this.payments.reduce((s,p) => s + (Number(p.amount)||0), 0); },

        get patientAppointments() {
          if (!this.selectedPatient.name) return [];
          return this.appointments.filter(a => (a.patientName || '').trim().toLowerCase() === this.selectedPatient.name.trim().toLowerCase());
        },

        get patientPayments() {
          if (!this.selectedPatient.name) return [];
          return this.payments.filter(p => (p.patientName || '').trim().toLowerCase() === this.selectedPatient.name.trim().toLowerCase());
        },

        openPatientHistory(p) {
          this.selectedPatient = p;
          this.showHistoryModal = true;
        },

        getWhatsAppLink(app) {
          let phoneClean = (app.phone || '').replace(/[^0-9]/g, '');
          if (phoneClean.startsWith('0')) phoneClean = '+213' + phoneClean.substring(1);
          const msg = encodeURIComponent(`مرحباً ${app.patientName}، نذكرك بموعدك في عيادة الأسنان يوم ${app.date} على الساعة ${app.time}.`);
          return `https://wa.me/${phoneClean}?text=${msg}`;
        },

        openPatientModal() {
          this.editingPatientId = null;
          this.patientForm = { name: '', phone: '', age: '', diagnosis: '' };
          this.showPatientModal = true;
        },
        editPatient(p) {
          this.editingPatientId = p.id;
          this.patientForm = { ...p };
          this.showPatientModal = true;
        },
        async savePatient() {
          const { db, collection, addDoc, doc, updateDoc } = window.firebaseService;
          if (this.editingPatientId) {
            await updateDoc(doc(db, "cabinet_patients", this.editingPatientId), this.patientForm);
          } else {
            await addDoc(collection(db, "cabinet_patients"), this.patientForm);
          }
          this.showPatientModal = false;
        },

        openAppointmentModal() {
          this.editingAppointmentId = null;
          this.appointmentForm = { patientName: '', phone: '', date: new Date().toISOString().split('T')[0], time: '09:00', treatment: '', cost: 2000 };
          this.showAppointmentModal = true;
        },
        openAppointmentModalForPatient(p) {
          this.openAppointmentModal();
          this.appointmentForm.patientName = p.name;
          this.appointmentForm.phone = p.phone || '';
        },
        editAppointment(app) {
          this.editingAppointmentId = app.id;
          this.appointmentForm = { ...app };
          this.showAppointmentModal = true;
        },
        async saveAppointment() {
          const { db, collection, addDoc, doc, updateDoc } = window.firebaseService;
          if (this.editingAppointmentId) {
            await updateDoc(doc(db, "cabinet_appointments", this.editingAppointmentId), this.appointmentForm);
          } else {
            await addDoc(collection(db, "cabinet_appointments"), this.appointmentForm);
          }
          this.showAppointmentModal = false;
        },

        openPaymentModal() {
          this.paymentForm = { patientName: '', amount: 0, date: new Date().toISOString().split('T')[0], note: '' };
          this.showPaymentModal = true;
        },
        async savePayment() {
          const { db, collection, addDoc } = window.firebaseService;
          const timeStr = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
          await addDoc(collection(db, "cabinet_payments"), { ...this.paymentForm, dateTime: `${this.paymentForm.date} à ${timeStr}`, timestamp: Date.now() });
          this.showPaymentModal = false;
        },

        async deleteRecord(collectionName, id) {
          if (confirm(this.lang === 'ar' ? 'هل أنت تأكد من الرغبة في الحذف؟' : 'Êtes-vous sûr de vouloir supprimer ?')) {
            const { db, doc, deleteDoc } = window.firebaseService;
            await deleteDoc(doc(db, collectionName, id));
          }
        },

        async sendChatMessage() {
          if (!this.chatInput.trim()) return;
          const { db, collection, addDoc } = window.firebaseService;
          await addDoc(collection(db, "cabinet_chat"), {
            senderEmail: this.userEmail,
            senderRole: this.userRole,
            text: this.chatInput,
            timestamp: Date.now(),
            time: new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })
          });
          this.chatInput = '';
        }
      }
    }
  </script>
