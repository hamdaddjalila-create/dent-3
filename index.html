<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion Cabinet Dentaire Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col" x-data="dentalApp()" x-init="initApp()">

  <!-- ÉCRAN DE CONNEXION -->
  <div x-show="!isAuthenticated" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-md p-4">
    <div class="bg-white border border-slate-200 rounded-3xl shadow-2xl w-full max-w-md p-8 space-y-6 relative overflow-hidden">
      <div class="text-center space-y-2">
        <div class="inline-flex bg-teal-600 text-white p-4 rounded-2xl shadow-lg shadow-teal-600/30 mb-2">
          <i class="fa-solid fa-tooth text-3xl"></i>
        </div>
        <h2 class="text-2xl font-black tracking-tight text-slate-900">Cabinet Dentaire</h2>
        <p class="text-xs text-slate-500 font-medium">Connectez-vous à votre espace de gestion</p>
      </div>

      <form @submit.prevent="login()" class="space-y-4 text-xs">
        <div>
          <label class="block font-bold text-slate-700 mb-1.5">Adresse Email</label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-slate-400"></i>
            <input type="email" x-model="loginEmail" placeholder="medecin3@clinic.com" required 
              class="w-full pl-10 pr-3 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 focus:outline-none focus:border-teal-600 transition">
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1.5">Mot de passe</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-400"></i>
            <input type="password" x-model="loginPassword" placeholder="••••••••" required 
              class="w-full pl-10 pr-3 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 focus:outline-none focus:border-teal-600 transition">
          </div>
        </div>

        <div x-show="authError" class="p-3 bg-rose-50 border border-rose-200 text-rose-600 rounded-xl text-center font-bold text-xs" x-text="authError"></div>

        <button type="submit" :disabled="isLoading" class="w-full bg-teal-600 hover:bg-teal-700 text-white py-3.5 rounded-xl font-bold text-xs transition shadow-lg shadow-teal-600/20 flex items-center justify-center gap-2">
          <span x-show="!isLoading" class="flex items-center gap-2"><i class="fa-solid fa-right-to-bracket"></i> Se Connecter</span>
          <span x-show="isLoading" class="animate-spin"><i class="fa-solid fa-circle-notch"></i></span>
        </button>
      </form>
    </div>
  </div>

  <!-- APPLICATION PRINCIPALE -->
  <div x-show="isAuthenticated" x-cloak class="flex-1 flex flex-col">
    <!-- EN-TÊTE -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="bg-teal-600 text-white p-2.5 rounded-xl shadow-md font-black text-xl">
            <i class="fa-solid fa-tooth"></i>
          </div>
          <div>
            <h1 class="font-black text-base text-slate-900 leading-none">Cabinet Dentaire Pro</h1>
            <p class="text-[11px] text-teal-600 font-semibold mt-1" x-text="userRole === 'doctor' ? 'Compte Médecin (Accès Total)' : 'Compte Assistant (Prise de RDV Uniquement)'"></p>
          </div>
        </div>

        <button @click="logout()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-2">
          <i class="fa-solid fa-power-off"></i> Déconnexion
        </button>
      </div>
    </header>

    <!-- NAVIGATION -->
    <nav class="bg-slate-100/80 border-b border-slate-200 sticky top-16 z-20 backdrop-blur-md">
      <div class="max-w-7xl mx-auto px-4 flex gap-2 overflow-x-auto text-xs font-bold py-2.5">
        <button @click="activeTab = 'agenda'" :class="activeTab === 'agenda' ? 'bg-teal-600 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'" class="px-4 py-2 rounded-xl transition flex items-center gap-2 whitespace-nowrap">
          <i class="fa-solid fa-calendar-days"></i> Agenda Mensuel & RDV
        </button>

        <template x-if="userRole === 'doctor'">
          <button @click="activeTab = 'patients'" :class="activeTab === 'patients' ? 'bg-teal-600 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'" class="px-4 py-2 rounded-xl transition flex items-center gap-2 whitespace-nowrap">
            <i class="fa-solid fa-users"></i> Dossiers Patients & Tranches
          </button>
        </template>

        <!-- الميزة الجديدة: تحليل الأشعة بالذكاء الاصطناعي -->
        <template x-if="userRole === 'doctor'">
          <button @click="activeTab = 'ai-radio'" :class="activeTab === 'ai-radio' ? 'bg-teal-600 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'" class="px-4 py-2 rounded-xl transition flex items-center gap-2 whitespace-nowrap">
            <i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i> IA Radiologie (Assistant)
          </button>
        </template>

        <template x-if="userRole === 'doctor'">
          <button @click="activeTab = 'finances'" :class="activeTab === 'finances' ? 'bg-teal-600 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'" class="px-4 py-2 rounded-xl transition flex items-center gap-2 whitespace-nowrap">
            <i class="fa-solid fa-wallet"></i> Finances & Recette
          </button>
        </template>

        <button @click="activeTab = 'chat'" :class="activeTab === 'chat' ? 'bg-teal-600 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'" class="px-4 py-2 rounded-xl transition flex items-center gap-2 whitespace-nowrap relative">
          <i class="fa-solid fa-comments"></i> Messagerie Interne
        </button>
      </div>
    </nav>

    <!-- CONTENU PRINCIPAL -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">

      <!-- AGENDA MENSUEL & RDV -->
      <div x-show="activeTab === 'agenda'" class="space-y-6">
        <!-- قسم الأجندة الأصلي -->
        <div class="bg-white border border-slate-200 rounded-3xl p-5 shadow-sm space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="font-bold text-slate-900 text-base flex items-center gap-2">
              <i class="fa-solid fa-calendar-alt text-teal-600"></i>
              <span x-text="currentMonthName + ' ' + currentYear"></span>
            </h2>
            <div class="flex items-center gap-2">
              <button @click="prevMonth()" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-slate-700 transition"><i class="fa-solid fa-chevron-left"></i></button>
              <button @click="nextMonth()" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-slate-700 transition"><i class="fa-solid fa-chevron-right"></i></button>
              <button @click="openAppointmentModal()" class="ml-2 bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 shadow-md">
                <i class="fa-solid fa-calendar-plus"></i> Nouveau RDV
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- واجهة تحليل الأشعة بالذكاء الاصطناعي الجديدة (AI RADIOLOGY) -->
      <div x-show="activeTab === 'ai-radio' && userRole === 'doctor'" x-cloak class="space-y-6">
        <div class="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm space-y-6">
          <div class="flex items-center justify-between border-b border-slate-100 pb-4">
            <div>
              <h2 class="font-black text-slate-900 text-lg flex items-center gap-2">
                <i class="fa-solid fa-wand-magic-sparkles text-teal-600"></i> Assistant IA - Analyse Radiographique
              </h2>
              <p class="text-xs text-slate-500">Chargez une radiographie dentaire pour obtenir une analyse indicative instantanée.</p>
            </div>
            <span class="bg-amber-50 text-amber-700 border border-amber-200 px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1.5">
              <i class="fa-solid fa-shield-halved"></i> Modèle Pro Multimodal
            </span>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- رفع الصورة ومعاينتها -->
            <div class="space-y-4">
              <label class="block font-bold text-xs text-slate-700">Sélectionner la Radiographie (X-Ray)</label>
              <div class="border-2 border-dashed border-slate-300 rounded-2xl p-6 text-center hover:border-teal-500 transition cursor-pointer bg-slate-50 relative" @click="$refs.radioInput.click()">
                <input type="file" x-ref="radioInput" @change="handleImageUpload($event)" accept="image/*" class="hidden">
                <template x-if="!uploadedImageUrl">
                  <div class="space-y-2">
                    <i class="fa-solid fa-cloud-arrow-up text-3xl text-slate-400"></i>
                    <p class="text-xs font-bold text-slate-600">Cliquez pour importer une image d'radio</p>
                    <p class="text-[10px] text-slate-400">PNG, JPG, JPEG jusqu'à 10MB</p>
                  </div>
                </template>
                <template x-if="uploadedImageUrl">
                  <div class="relative">
                    <img :src="uploadedImageUrl" class="max-h-64 mx-auto rounded-xl shadow-md border border-slate-200 object-contain">
                    <button @click.stop="uploadedImageUrl = null; aiAnalysisResult = null" class="absolute top-2 right-2 bg-rose-600 text-white p-2 rounded-full text-xs shadow-md hover:bg-rose-700 transition">
                      <i class="fa-solid fa-xmark"></i>
                    </button>
                  </div>
                </template>
              </div>

              <button @click="analyzeRadioWithAI()" :disabled="!uploadedImageUrl || isAnalyzing" class="w-full bg-teal-600 hover:bg-teal-700 disabled:opacity-50 text-white py-3 rounded-xl font-bold text-xs transition shadow-md flex items-center justify-center gap-2">
                <span x-show="!isAnalyzing" class="flex items-center gap-2"><i class="fa-solid fa-brain"></i> Lancer l'Analyse IA</span>
                <span x-show="isAnalyzing" class="flex items-center gap-2"><i class="fa-solid fa-spinner animate-spin"></i> Analyse en cours...</span>
              </button>
            </div>

            <!-- نتائج التحليل -->
            <div class="space-y-4">
              <h3 class="font-bold text-xs text-slate-700 flex items-center gap-2">
                <i class="fa-solid fa-file-medical-decls text-teal-600"></i> Rapport Indicatif IA
              </h3>
              
              <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 min-h-[250px] text-xs space-y-3 relative">
                <template x-if="!aiAnalysisResult && !isAnalyzing">
                  <div class="h-full flex flex-col items-center justify-center text-center text-slate-400 py-12">
                    <i class="fa-solid fa-microscope text-4xl mb-2"></i>
                    <p>Importez une image et lancez l'analyse pour afficher les suggestions du médecin IA.</p>
                  </div>
                </template>

                <template x-if="isAnalyzing">
                  <div class="h-full flex flex-col items-center justify-center text-center text-teal-600 py-12 space-y-3">
                    <i class="fa-solid fa-circle-notch text-3xl animate-spin"></i>
                    <p class="font-bold">Analyse binaire de l'image par le modèle Gemini Pro...</p>
                  </div>
                </template>

                <template x-if="aiAnalysisResult && !isAnalyzing">
                  <div class="space-y-3">
                    <div class="p-3 bg-teal-50 border border-teal-200 rounded-xl text-teal-900 leading-relaxed font-medium whitespace-pre-line" x-text="aiAnalysisResult"></div>
                    
                    <div class="p-3 bg-amber-50 border border-amber-200 rounded-xl text-amber-800 text-[11px] flex gap-2 items-start">
                      <i class="fa-solid fa-triangle-exclamation mt-0.5 text-amber-600"></i>
                      <span><strong>Avertissement Légal :</strong> Ce rapport est fourni à titre indicatif pour assister le praticien. La décision clinique finale et la prescription appartiennent exclusivement au médecin traitant.</span>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script>
    function dentalApp() {
      return {
        isAuthenticated: true,
        userRole: 'doctor', // 'doctor' ou 'assistant'
        userEmail: 'medecin3@clinic.com',
        activeTab: 'agenda',
        isLoading: false,
        
        // المتغيرات الخاصة بميزة الذكاء الاصطناعي
        uploadedImageUrl: null,
        isAnalyzing: false,
        aiAnalysisResult: null,

        initApp() {
          console.log("App initialized");
        },

        handleImageUpload(event) {
          const file = event.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
              this.uploadedImageUrl = e.target.result;
              this.aiAnalysisResult = null;
            };
            reader.readAsDataURL(file);
          }
        },

        async analyzeRadioWithAI() {
          if (!this.uploadedImageUrl) return;
          this.isAnalyzing = true;
          this.aiAnalysisResult = null;

          try {
            // محاكاة الاتصال برابط Gemini API عبر Firebase Functions
            setTimeout(() => {
              this.aiAnalysisResult = `🔍 OBSERVATIONS RADIOGRAPHIQUES:
• Dent #36 : Zone d'ombre suspecte au niveau coronaire suggérant une carie dentinaire profonde.
• Zone Périapicale : Légère clarté périapicale à vérifier sur la racine distale.
• Perte Osseuse : Niveau d'os alvéolaire dans les limites normales.

💡 SUGGESTIONS DE TRAITEMENT INDICATIVES:
1. Traitement de carie / Test de vitalité pulpaire.
2. Éventuel traitement endodontique (Dévitalisation) si atteinte pulpaire confirmée.

💊 PRESCRIPTIONS COURANTES ASSOCIÉES (À VALIDER) :
- Antalgique : Paracétamol 1g si douleur.
- Bain de bouche antiseptique (Chlorhexidine 0.12%).`;
              this.isAnalyzing = false;
            }, 2500);

          } catch (error) {
            console.error(error);
            this.aiAnalysisResult = "Erreur lors de l'analyse de la radiographie. Veuillez réessayer.";
            this.isAnalyzing = false;
          }
        }
      };
    }
  </script>
</body>
</html>
